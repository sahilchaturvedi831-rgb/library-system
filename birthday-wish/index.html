<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Wisher</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=300&h=200&fit=crop&crop=center" alt="Birthday Cake" class="birthday-image">
        <div class="floating-images">
            <img src="https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?w=100&h=100&fit=crop&crop=center" alt="Balloons" class="floating-image balloon1">
            <img src="https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=100&h=100&fit=crop&crop=center" alt="Confetti" class="floating-image confetti1">
            <img src="https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?w=80&h=80&fit=crop&crop=center" alt="Balloons" class="floating-image balloon2">
            <img src="https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=80&h=80&fit=crop&crop=center" alt="Confetti" class="floating-image confetti2">
        </div>
        <h1>🎉 Happy Birthday Wisher 🎉</h1>
        <div class="input-section">
            <label for="name">Enter the birthday person's name:</label>
            <input type="text" id="name" placeholder="e.g., John Doe">
            <button id="wish-btn">Generate Wish</button>
        </div>
        <div id="wish-display" class="wish-display"></div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
